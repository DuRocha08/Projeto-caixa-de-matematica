<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Atividade - Caixa de Matemática</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Criar Nova Atividade </h1>
        <p><a href="index.html" style="color: var(--meringe); text-decoration: none;"> Voltar ao Início</a></p>
    </header>
    <main>
        <section class="card-cadastro">
            <form id="form-atividade">
                <input type="text" id="titulo" placeholder="Título da Atividade" required>
                <input type="text" id="autor" placeholder="Seu Nome (Quem criou?)">
                <input type="text" id="publico" placeholder="Público Alvo (Ex: 3º Ano)">
                <input type="text" id="conceito" placeholder="Conceito Matemático">
                <textarea id="objetivo" placeholder="Objetivo da Atividade" rows="2"></textarea>
                <textarea id="material" placeholder="Materiais Necessários" rows="2"></textarea>
                <textarea id="desenvolvimento" placeholder="Desenvolvimento da Atividade" rows="3"></textarea>
                <button type="submit">Guardar Atividade! </button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
